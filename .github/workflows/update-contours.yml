name: Update Contour Data

# Runs daily and can also be started by hand from the Actions tab.
# Free on GitHub: public repos get unlimited Actions minutes.
on:
  schedule:
    - cron: '0 8 * * *'   # 8:00 UTC every day
  workflow_dispatch: {}    # adds a "Run workflow" button

permissions:
  contents: write          # lets the job save the new data file into the repo

# Never run two copies at once (they would collide when saving).
concurrency:
  group: update-contours
  cancel-in-progress: false

jobs:
  update-contours:
    runs-on: ubuntu-24.04   # pinned: GitHub is moving "ubuntu-latest" to Ubuntu 26.04 (Oct 19 - Nov 19, 2026), which can break the GDAL install
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      - name: Run contour generation
        run: |
          mkdir -p data
          # SMALL TEST AREA (about 2 km square near Gulfport, MS). Start small to prove the
          # pipeline works; a whole county at 1-foot detail is far too large to test with.
          python3 3dep_contours.py \
            --bbox -89.10 30.37 -89.08 30.39 \
            --interval-ft 1 \
            --out data/test-area-contours.geojson

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to save."
            exit 0
          fi
          git commit -m "Daily contour data update $(date -u +%Y-%m-%d)"
          # If the repository changed while this job was running (someone edited a file, or another
          # run saved first), catch up and try again instead of failing. If both changed the same
          # data file, this run's newly generated version wins.
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "Saved on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt did not go through; retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Could not save after 3 attempts."
          exit 1
